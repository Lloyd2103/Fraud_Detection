# Spark Master and Deploy Mode
spark.master                      spark://labsoe-17:7077
spark.submit.deployMode           client

# Automatic Package Injection (Delta Lake and Kafka Streaming)
spark.jars.packages               io.delta:delta-spark_2.12:3.1.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
spark.sql.extensions              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog   org.apache.spark.sql.delta.catalog.DeltaCatalog

# Driver Config (Master Node)
spark.driver.memory               2g
spark.driver.cores                2

# Executor Config (Worker Nodes)
spark.executor.memory             2560m
spark.executor.cores              3

# Total Cluster Core Limit
spark.cores.max                   6

# Optimization Options
spark.sql.shuffle.partitions      16
spark.sql.adaptive.enabled        true
spark.sql.adaptive.skewJoin.enabled true
spark.serializer                  org.apache.spark.serializer.KryoSerializer
