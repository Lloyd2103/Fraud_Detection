global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend cockroach_frontend
    bind 127.0.0.1:26257
    bind 192.168.80.200:26257
    mode tcp
    default_backend cockroach_backend

backend cockroach_backend
    mode tcp
    balance roundrobin
    option httpchk GET /health?ready=1
    server cockroach1 192.168.80.201:26257 check port 8082
    server cockroach2 192.168.80.202:26257 check port 8082
    server cockroach3 192.168.80.203:26257 check port 8082

listen stats
    bind 127.0.0.1:8085
    mode http
    stats enable
    stats uri /
    stats refresh 5s
